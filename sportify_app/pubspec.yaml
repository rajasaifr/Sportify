name: sportify_app
description: A Sportify flutter application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.0
  
  # --- CRITICAL FIX: ADDING THE SVG PACKAGE ---
  flutter_svg: ^2.0.10+1 

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # --- ASSET CONFIGURATION ---
  assets:
    - assets/images/ # Registers your App_Icon.png folder (Best practice)
    - assets/images/floating_icons/  # KEEP THIS COMMENTED OUT UNTIL YOU CREATE THE FOLDER AND ADD SVG FILES